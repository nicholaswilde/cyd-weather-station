---
version: '3'

dotenv: ['.env']

vars:
  PIO_ENV: '{{.PIO_ENV | default "cyd_28r"}}'

tasks:
  init:
    desc: Initialize project environment file and secrets
    status:
      - test -f .env
      - test -f config/secrets.h
    preconditions:
      - test -f .env.example
      - test -f config/secrets.h.example
    cmds:
      - cp .env.example .env
      - cp config/secrets.h.example config/secrets.h

  coverage:report:
    desc: Show coverage report
    cmds:
      - task: test
        ignore_error: true
      - lcov --list lcov.info
      - defer: rm lcov.info
      
  coverage:upload:
    desc: Generate and upload coverage report to Coveralls.io
    dotenv: ['.env']
    preconditions:
      - sh: 'test -n "$COVERALLS_REPO_TOKEN"'
        msg: "COVERALLS_REPO_TOKEN is not set. Please add it to your .env file."
    cmds:
      # 1. Run native tests to output coverage data
      - task: test
        ignore_error: true
      # 2. Extract and capture raw code coverage reports
      - lcov --capture --base-directory . --directory .pio/build/native/ --output-file lcov_raw.info --rc branch_coverage=1 --ignore-errors "gcov,source"
      # 3. Clean up the report by filtering out system and test files
      - lcov --remove lcov_raw.info '*/.pio/*' '*/tests/*' '*/tests/mocks/*' '/usr/*' -o lcov.info --rc branch_coverage=1 --ignore-errors source
      # 4. Upload to coveralls using the CLI binary
      - coveralls report lcov.info -n -r $COVERALLS_REPO_TOKEN
      # 5. Clean up temporary local files
      - defer: rm lcov_raw.info lcov.info
    
  screenshots:
    desc: Capture all screenshots from the ESP32 CYD board
    dotenv: ['.env']
    preconditions:
      - sh: 'test -n "$CYD_DEVICE_IP"'
        msg: "CYD_DEVICE_IP is not set. Please add it to your .env file."
    cmds:
      - bash ./scripts/capture-screenshots.sh $CYD_DEVICE_IP

  eau:
    desc: Erase and upload
    cmds:
      - pio run -e {{.PIO_ENV}} -t erase -t upload

  eau:cyd_28r:
    desc: Erase and upload for cyd_28r
    cmds:
      - pio run -e cyd_28r -t erase -t upload

  eau:cyd_28r_inv:
    desc: Erase and upload for cyd_28r_inv
    cmds:
      - pio run -e cyd_28r_inv -t erase -t upload

  eau:cyd_35c:
    desc: Erase and upload for cyd_35c
    cmds:
      - pio run -e cyd_35c -t erase -t upload

  eau:cyd_35c_inv:
    desc: Erase and upload for cyd_35c_inv
    cmds:
      - pio run -e cyd_35c_inv -t erase -t upload

  uam:
    desc: Upload and monitor
    cmds:
      - pio run -e {{.PIO_ENV}} -t upload -t monitor

  uam:cyd_28r:
    desc: Upload and monitor for cyd_28r
    cmds:
      - pio run -e cyd_28r -t upload -t monitor

  uam:cyd_28r_inv:
    desc: Upload and monitor for cyd_28r_inv
    cmds:
      - pio run -e cyd_28r_inv -t upload -t monitor

  uam:cyd_35c:
    desc: Upload and monitor for cyd_35c
    cmds:
      - pio run -e cyd_35c -t upload -t monitor

  uam:cyd_35c_inv:
    desc: Upload and monitor for cyd_35c_inv
    cmds:
      - pio run -e cyd_35c_inv -t upload -t monitor

  build:
    desc: Build the firmware
    cmds:
      - pio run -e {{.PIO_ENV}}

  build:cyd_28r:
    desc: Build firmware for cyd_28r
    cmds:
      - pio run -e cyd_28r

  build:cyd_28r_inv:
    desc: Build firmware for cyd_28r_inv
    cmds:
      - pio run -e cyd_28r_inv

  build:cyd_35c:
    desc: Build firmware for cyd_35c
    cmds:
      - pio run -e cyd_35c

  build:cyd_35c_inv:
    desc: Build firmware for cyd_35c_inv
    cmds:
      - pio run -e cyd_35c_inv

  upload:
    desc: Upload the firmware to the ESP32 CYD board
    cmds:
      - pio run -e {{.PIO_ENV}} --target upload

  upload:cyd_28r:
    desc: Upload firmware for cyd_28r
    cmds:
      - pio run -e cyd_28r --target upload

  upload:cyd_28r_inv:
    desc: Upload firmware for cyd_28r_inv
    cmds:
      - pio run -e cyd_28r_inv --target upload

  upload:cyd_35c:
    desc: Upload firmware for cyd_35c
    cmds:
      - pio run -e cyd_35c --target upload

  upload:cyd_35c_inv:
    desc: Upload firmware for cyd_35c_inv
    cmds:
      - pio run -e cyd_35c_inv --target upload

  monitor:
    desc: Start the serial monitor
    cmds:
      - pio device monitor

  test:
    desc: Run unit tests
    cmds:
      - pio test -e native

  check:
    desc: Run static code analysis / linting
    cmds:
      - pio check -e {{.PIO_ENV}}

  check:cyd_28r:
    desc: Run static code analysis / linting for cyd_28r
    cmds:
      - pio check -e cyd_28r

  check:cyd_28r_inv:
    desc: Run static code analysis / linting for cyd_28r_inv
    cmds:
      - pio check -e cyd_28r_inv

  check:cyd_35c:
    desc: Run static code analysis / linting for cyd_35c
    cmds:
      - pio check -e cyd_35c

  check:cyd_35c_inv:
    desc: Run static code analysis / linting for cyd_35c_inv
    cmds:
      - pio check -e cyd_35c_inv

  clean:
    desc: Clean build files
    cmds:
      - pio run -e {{.PIO_ENV}} --target clean

  clean:cyd_28r:
    desc: Clean build files for cyd_28r
    cmds:
      - pio run -e cyd_28r --target clean

  clean:cyd_28r_inv:
    desc: Clean build files for cyd_28r_inv
    cmds:
      - pio run -e cyd_28r_inv --target clean

  clean:cyd_35c:
    desc: Clean build files for cyd_35c
    cmds:
      - pio run -e cyd_35c --target clean

  clean:cyd_35c_inv:
    desc: Clean build files for cyd_35c_inv
    cmds:
      - pio run -e cyd_35c_inv --target clean

  erase:
    desc: Erase the ESP32 flash memory (clears all saved settings)
    cmds:
      - pio run -e {{.PIO_ENV}} --target erase

  erase:cyd_28r:
    desc: Erase flash memory for cyd_28r
    cmds:
      - pio run -e cyd_28r --target erase

  erase:cyd_28r_inv:
    desc: Erase flash memory for cyd_28r_inv
    cmds:
      - pio run -e cyd_28r_inv --target erase

  erase:cyd_35c:
    desc: Erase flash memory for cyd_35c
    cmds:
      - pio run -e cyd_35c --target erase

  erase:cyd_35c_inv:
    desc: Erase flash memory for cyd_35c_inv
    cmds:
      - pio run -e cyd_35c_inv --target erase

  setup:node:
    desc: Install Node.js dependencies for font generation
    cmds:
      - npm install

  font:generate:
    desc: Generate custom weather icon font from TTF source
    deps: [setup:node]
    cmds:
      - npm run font:generate
      - npm run font:generate:24
      - npm run font:generate:72

  default:
    cmds:
      - task -l
    silent: true

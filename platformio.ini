; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cyd_35c
test_dir = tests

[env]
monitor_speed = 115200
check_src_filters = 
	+<src/>
	+<include/>
check_flags = 
	cppcheck: --suppress=*:*/.pio/*
	cppcheck: --suppress=unmatchedSuppression

[cyd_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
check_skip_packages = yes
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/extra_scripts.py
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	lvgl/lvgl@^8.3.11
	bblanchon/ArduinoJson@^6.21.3
	me-no-dev/AsyncTCP@^1.1.1
	marvinroger/AsyncMqttClient@^0.9.0
	jnthas/Improv WiFi Library@^0.0.4
build_flags = 
	-D USER_SETUP_LOADED=1
	-D USE_HSPI_PORT=1
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D LOAD_GLCD=0
	-D LOAD_FONT2=0
	-D LOAD_FONT4=0
	-D LOAD_FONT6=0
	-D LOAD_FONT7=0
	-D LOAD_FONT8=0
	-D LOAD_GFXFF=0
	-D SMOOTH_FONT=0
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D LVGL_VERSION_MAJOR=8
	-D LVGL_VERSION_MINOR=4
	-D TOUCH_CS=-1
	-I include/
	-I .

[env:cyd_28r]
extends = cyd_base
build_flags = 
	${cyd_base.build_flags}
	-D ILI9341_DRIVER=1
	-D TFT_BL=21
	-D XPT2046_CS=33
	-D XPT2046_IRQ=36
	-D XPT2046_MOSI=32
	-D XPT2046_MISO=39
	-D XPT2046_CLK=25

[env:cyd_28r_inv]
extends = cyd_base
build_flags = 
	${cyd_base.build_flags}
	-D ILI9341_DRIVER=1
	-D TFT_BL=21
	-D XPT2046_CS=33
	-D XPT2046_IRQ=36
	-D XPT2046_MOSI=32
	-D XPT2046_MISO=39
	-D XPT2046_CLK=25
	-D TFT_INVERSION_ON=1

[env:cyd_35c]
extends = cyd_base
build_flags = 
	${cyd_base.build_flags}
	-D ST7796_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_BL=27

[env:cyd_35c_inv]
extends = cyd_base
build_flags = 
	${cyd_base.build_flags}
	-D ST7796_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_BL=27
	-D TFT_INVERSION_ON=1

[env:native]
platform = native
lib_deps = 
	bblanchon/ArduinoJson@^6.21.3
build_flags = 
	-D NATIVE_TEST=1
	-D LVGL_VERSION_MAJOR=8
	-D LVGL_VERSION_MINOR=4
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-I include/
	-I tests/mocks/
	-I .
	--coverage
	-lgcov
build_src_filter = 
	+<../src/mqtt_manager.cpp>
